[package]
name = "viper"
version = "0.1.0"
edition = "2024"
description = "Viper: an analysis engine for Difflicit that writes up the visual changes between two artifacts as diffmd."
license = "MIT"
publish = false

# The library has a neutral name, so forks of Viper share its code unchanged (only the package's name differs).
[lib]
name = "engine"

[dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = true
